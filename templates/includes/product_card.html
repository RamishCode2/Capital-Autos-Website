<div class="col-lg-3 col-md-4 col-sm-6 mb-4">

    <div class="product-card">

        {% if product.image %}
        <img src="{{ product.image.url }}"
             alt="{{ product.name }}">
        {% else %}
        <img src="https://via.placeholder.com/300x220?text=No+Image"
             alt="No Image">
        {% endif %}

        <div class="product-info">

            <h5>{{ product.name }}</h5>

            <p class="price">
                Rs. {{ product.price }}
            </p>

            {% if product.stock > 0 %}
                <span class="badge bg-success">In Stock</span>
            {% else %}
                <span class="badge bg-danger">Out of Stock</span>
            {% endif %}

            <div class="mt-3 d-grid gap-2">

                <form method="post" action="{% url 'toggle_wishlist' product.id %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.path }}">
                    <button type="submit" class="btn btn-outline-danger w-100">Save to Wishlist</button>
                </form>

                <a href="{% url 'product_detail' product.id %}"
                   class="btn btn-dark">
                    View Details
                </a>

                <form method="post" action="{% url 'add_to_cart' product.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100" {% if product.stock <= 0 or product.stock_status != 'in_stock' %}disabled{% endif %}>Add to Cart</button>
                </form>

            </div>

        </div>

    </div>

</div>
