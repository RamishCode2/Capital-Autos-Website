{% load static %}

<div class="dropdown ms-lg-3">

    <button class="btn user-menu-btn dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false">

        <div class="d-flex align-items-center">

            <!-- Avatar -->
           
   {% if user.profile.image %}
    <img src="{{ user.profile.image.url }}" ...>
{% else %}
    <img src="{% static 'images/avatar.png' %}" alt="User Avatar" height="80" width="80">
{% endif %}

            <!-- User Info -->
            <div class="ms-2 text-start d-none d-lg-block">

                <small class="text-light d-block">
                    Hi,
                </small>

                <strong class="text-white">
                    {{ user.first_name|default:user.username }}
                </strong>

            </div>

        </div>

    </button>

    <div class="dropdown-menu dropdown-menu-end user-dropdown">

        <!-- Header -->
        <div class="dropdown-header-user text-center">

            <div class="avatar-large">
                <i class="bi bi-person-circle"></i>
            </div>

            <h6 class="mt-3 mb-1 fw-bold">
                {{ user.get_full_name|default:user.username }}
            </h6>

            <small class="text-muted">
                {{ user.email }}
            </small>

        </div>

        <hr class="my-0">

        <!-- Menu -->
        <a class="dropdown-item" href="{% url 'profile' %}">
            <i class="bi bi-person-circle"></i>
            My Profile
        </a>

        <a class="dropdown-item" href="#">
            <i class="bi bi-box-seam"></i>
            My Orders
        </a>

        <a class="dropdown-item" href="#">
            <i class="bi bi-heart"></i>
            Wishlist
            <span class="badge bg-danger rounded-pill float-end">0</span>
        </a>

        <a class="dropdown-item" href="{% url 'cart' %}">
            <i class="bi bi-cart3"></i>
            Shopping Cart
            <span class="badge bg-danger rounded-pill float-end">
                {{ cart_item_count }}
            </span>
        </a>

        <a class="dropdown-item" href="#">
            <i class="bi bi-gear"></i>
            Settings
        </a>

        <a class="dropdown-item" href="{% url 'password_reset' %}">
            <i class="bi bi-shield-lock"></i>
            Security
        </a>

        <hr class="my-0">

       <button
    type="button"
    class="dropdown-item logout-item text-danger"
    data-bs-toggle="modal"
    data-bs-target="#logoutModal">

    <i class="bi bi-box-arrow-right"></i>
    Logout

</button>

    </div>

</div>
